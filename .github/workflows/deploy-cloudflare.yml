name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      SMM_PROVIDER_API_VERSION: ${{ vars.SMM_PROVIDER_API_VERSION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate PanelFollows key
        env:
          SMM_PROVIDER_API_KEY: ${{ secrets.SMM_PROVIDER_API_KEY }}
        run: |
          if [ -z "$SMM_PROVIDER_API_KEY" ]; then
            echo "Add SMM_PROVIDER_API_KEY to the production environment before deploying." >&2
            exit 1
          fi

      - name: Validate customer email sender
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "Add the Gmail app password as SMTP_PASS in the production environment." >&2
            exit 1
          fi

      - name: Validate Turnstile keys
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "Add TURNSTILE_SITE_KEY as a production variable and TURNSTILE_SECRET_KEY as a production secret." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare Cloudflare bindings
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Ensure elturcosmm.com uses this Worker
        env:
          DOMAIN_HOSTNAME: elturcosmm.com
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api?hostname=$DOMAIN_HOSTNAME")"
          current_service="$(printf '%s' "$response" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s), row=(j.result||[]).find(x=>x.hostname===process.env.DOMAIN_HOSTNAME);
              process.stdout.write(row?.service||"");
            });
          ')"
          echo "Current custom-domain worker: ${current_service:-none}"
          echo "Target worker: $CF_WORKER_NAME"
          if [ "$current_service" != "$CF_WORKER_NAME" ]; then
            payload="$(node -e 'process.stdout.write(JSON.stringify({hostname:process.env.DOMAIN_HOSTNAME,service:process.env.CF_WORKER_NAME,zone_name:process.env.DOMAIN_HOSTNAME}))')"
            update="$(curl --silent --show-error --fail-with-body -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$api")"
            printf '%s' "$update" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s);
                if(!j.success) throw new Error(JSON.stringify(j.errors||j));
                console.log("Custom domain attached:",j.result?.hostname,"->",j.result?.service);
              });
            '
            sleep 5
          fi

      - name: Verify direct Worker welcome
        run: |
          direct="https://${CF_WORKER_NAME}.uludex-tr.workers.dev/"
          status="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' --output /tmp/direct.html --write-out '%{http_code}' "$direct?deploy=$GITHUB_SHA")"
          echo "Direct Worker HTTP $status"
          if [ "$status" != "200" ]; then
            head -c 1000 /tmp/direct.html
            exit 1
          fi
          if grep -q '/welcome/style.css' /tmp/direct.html; then
            echo "Direct Worker serves cinematic welcome."
          else
            echo "Direct Worker root marker missing; first response bytes:"
            head -c 1200 /tmp/direct.html
          fi
      - name: Sync runtime secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          SMM_PROVIDER_API_KEY: ${{ secrets.SMM_PROVIDER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          trap 'rm -f .cloudflare-secrets.json' EXIT
          node scripts/write-cloudflare-secrets.mjs
          pnpm exec wrangler secret bulk .cloudflare-secrets.json --config dist/server/wrangler.json

      - name: Verify Gmail delivery once
        if: github.event_name == 'push' && github.event.head_commit.message == 'Verify Gmail delivery once' && github.run_attempt == 1
        continue-on-error: true
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/smtp-delivery-smoke.mjs

      - name: Verify Gmail delivery from Cloudflare Worker once
        if: github.event_name == 'push' && github.event.head_commit.message == 'Verify Gmail delivery once' && github.run_attempt == 1
        continue-on-error: true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/worker-email-smoke.mjs

      - name: Verify customer registration
        run: node scripts/smoke-unverified-customer.mjs

      - name: Sync PanelFollows catalog
        run: |
          status="$(curl --silent --show-error --retry 2 --retry-delay 5 --max-time 120 --output /tmp/services.json --write-out '%{http_code}' https://elturcosmm.com/api/services)"
          if [ "$status" != "200" ]; then
            echo "Katalog senkronu HTTP $status ile başarısız oldu:"
            cat /tmp/services.json
            exit 1
          fi
          node -e 'const rows=JSON.parse(require("node:fs").readFileSync("/tmp/services.json","utf8")); if(!Array.isArray(rows)||rows.length===0) throw new Error("PanelFollows katalogu boş döndü"); console.log(`${rows.length} hizmet satışa hazır.`)'

      - name: Verify storefront page
        run: |
          root_status="$(curl --silent --show-error --location --retry 2 --retry-delay 3 --max-time 45 --header 'Cache-Control: no-cache' --output /tmp/welcome.html --write-out '%{http_code}' "https://elturcosmm.com/?deploy=$GITHUB_SHA")"
          if [ "$root_status" != "200" ] || ! grep -q '/welcome/style.css' /tmp/welcome.html; then
            echo "Standalone welcome page verification failed (HTTP $root_status):"
            head -c 1200 /tmp/welcome.html
            exit 1
          fi

          panel_status="$(curl --silent --show-error --location --retry 2 --retry-delay 3 --max-time 45 --header 'Cache-Control: no-cache' --output /tmp/panel.html --write-out '%{http_code}' "https://elturcosmm.com/site/?deploy=$GITHUB_SHA")"
          if [ "$panel_status" != "200" ] || ! grep -q 'premium-20260927.css' /tmp/panel.html; then
            echo "Customer panel verification failed (HTTP $panel_status):"
            head -c 1200 /tmp/panel.html
            exit 1
          fi
          echo "Standalone welcome and customer panel are both serving correctly."

      - name: Verify storefront stylesheet and script
        run: |
          node --input-type=module <<'NODE'
          const assets = [
            ["https://elturcosmm.com/site/premium-20260927.css", "--sidebar:260px", "CSS"],
            ["https://elturcosmm.com/site/app-20260927.js", "selectedService", "JavaScript"],
          ];
          for (const [url, marker, name] of assets) {
            const response = await fetch(url, { cache: "no-store", headers: { "accept-encoding": "identity" } });
            const headers = Object.fromEntries(["content-type", "content-encoding", "content-length", "cache-control"].map((key) => [key, response.headers.get(key)]));
            const body = await response.text();
            if (!response.ok || !body.includes(marker)) throw new Error(`${name} asset is invalid (HTTP ${response.status}; ${JSON.stringify(headers)}; ${JSON.stringify(body.slice(0, 100))})`);
            if (headers["content-encoding"] && headers["content-encoding"] !== "identity") throw new Error(`${name} asset was unexpectedly transformed (HTTP ${response.status}; ${JSON.stringify(headers)})`);
          }
          console.log("Storefront CSS and JavaScript assets are being served.");
          NODE
