name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      SMM_PROVIDER_API_VERSION: ${{ vars.SMM_PROVIDER_API_VERSION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate PanelFollows key
        env:
          SMM_PROVIDER_API_KEY: ${{ secrets.SMM_PROVIDER_API_KEY }}
        run: |
          if [ -z "$SMM_PROVIDER_API_KEY" ]; then
            echo "Add SMM_PROVIDER_API_KEY to the production environment before deploying." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare Cloudflare bindings
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Sync runtime secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          SMM_PROVIDER_API_KEY: ${{ secrets.SMM_PROVIDER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          trap 'rm -f .cloudflare-secrets.json' EXIT
          node scripts/write-cloudflare-secrets.mjs
          pnpm exec wrangler secret bulk .cloudflare-secrets.json --config dist/server/wrangler.json

      - name: Verify customer registration
        run: |
          email="deploy-smoke-${GITHUB_RUN_ID}@example.invalid"
          cleanup() {
            pnpm exec wrangler d1 execute DB --remote --config dist/server/wrangler.json --command "DELETE FROM customer_sessions WHERE user_id IN (SELECT id FROM customer_users WHERE email='$email'); DELETE FROM customer_balances WHERE email='$email'; DELETE FROM customer_users WHERE email='$email';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 3 --max-time 60 --output /tmp/challenge.json --write-out '%{http_code}' -X POST https://elturcosmm.com/api/account/challenge --header 'content-type: application/json' --data '{}')"
          test "$status" = "200"
          challenge_id="$(node -e 'const d=JSON.parse(require("node:fs").readFileSync("/tmp/challenge.json","utf8")); console.log(d.id)')"
          challenge_answer="$(node -e 'const d=JSON.parse(require("node:fs").readFileSync("/tmp/challenge.json","utf8")); const n=d.question.match(/\d+/g).map(Number); if(n.length!==2) throw new Error("Doğrulama sorusu okunamadı"); console.log(n[0]+n[1])')"
          status="$(curl --silent --show-error --retry 2 --retry-delay 3 --max-time 60 --cookie-jar /tmp/register.cookies --output /tmp/register.json --write-out '%{http_code}' https://elturcosmm.com/api/account/register --header 'content-type: application/json' --data "{\"name\":\"Deploy Test\",\"email\":\"$email\",\"password\":\"DeployTest-9284\",\"challengeId\":\"$challenge_id\",\"challengeAnswer\":\"$challenge_answer\"}")"
          cat /tmp/register.json
          test "$status" = "200"
          status="$(curl --silent --show-error --max-time 30 --cookie /tmp/register.cookies --output /tmp/avatar.json --write-out '%{http_code}' https://elturcosmm.com/api/account/profile --request POST --header 'content-type: application/json' --data '{"avatar":"orbit"}')"
          test "$status" = "200"
          curl --silent --show-error --max-time 30 --cookie /tmp/register.cookies --output /tmp/account.json https://elturcosmm.com/api/account
          cat /tmp/account.json
          node -e 'const account=JSON.parse(require("node:fs").readFileSync("/tmp/account.json","utf8")); if(!account.loggedIn||account.user.balance!==0||account.user.avatar!=="orbit") throw new Error("Oturum, avatar veya bakiye doğrulanamadı");'

      - name: Sync PanelFollows catalog
        run: |
          status="$(curl --silent --show-error --retry 2 --retry-delay 5 --max-time 120 --output /tmp/services.json --write-out '%{http_code}' https://elturcosmm.com/api/services)"
          if [ "$status" != "200" ]; then
            echo "Katalog senkronu HTTP $status ile başarısız oldu:"
            cat /tmp/services.json
            exit 1
          fi
          node -e 'const rows=JSON.parse(require("node:fs").readFileSync("/tmp/services.json","utf8")); if(!Array.isArray(rows)||rows.length===0) throw new Error("PanelFollows katalogu boş döndü"); console.log(`${rows.length} hizmet satışa hazır.`)'
